<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- PWA Meta Tags -->
  <meta name="application-name" content="Panahon">
  <meta name="description" content="Sistema de control horario para PyMEs mediante códigos QR">
  <meta name="theme-color" content="#F97316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Panahon">
  
  <!-- iOS Safari -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  
  <title>Panahon - Control Horario</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app/App.tsx"></script>
  
  <!-- Service Worker Registration -->
  <script>
    // Registrar Service Worker solo en producción y solo para /fichaje
    if ('serviceWorker' in navigator && window.location.pathname.startsWith('/fichaje')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js')
          .then(reg => {
            console.log('[PWA] Service Worker registrado:', reg.scope);

            // Detectar nueva versión disponible
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker?.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Hay nueva versión — forzar actualización silenciosa
                  newWorker.postMessage('SKIP_WAITING');
                  window.location.reload();
                }
              });
            });
          })
          .catch(err => console.log('[PWA] Error al registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
